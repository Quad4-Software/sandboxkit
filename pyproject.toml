[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandboxkit"
dynamic = ["version"]
description = "Sandbox runner for Linux: namespaces, rlimits and Landlock"
readme = "README.md"
requires-python = ">=3.10"
license = "0BSD"
authors = [{ name = "Quad4" }]
keywords = ["sandbox", "namespaces", "landlock", "isolation", "security", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Operating System Kernels :: Linux",
    "Typing :: Typed",
]
dependencies = ["landlockpy>=0.1.1"]

[project.urls]
Homepage = "https://quad4.io"
Repository = "https://github.com/Quad4-Software/sandboxkit"
Issues = "https://github.com/Quad4-Software/sandboxkit/issues"
Changelog = "https://github.com/Quad4-Software/sandboxkit/blob/master/CHANGELOG.md"

[tool.hatch.version]
path = "src/sandboxkit/__init__.py"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "bandit>=1.9.4",
    "mypy>=2.3.1",
]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "YTT",      # sys.version misuse
    "FA",       # future annotations
    "A",        # builtins shadowing
    "B",        # flake8-bugbear
    "BLE",      # blind except
    "C4",       # comprehensions
    "C90",      # mccabe complexity
    "DTZ",      # timezone-aware datetimes
    "ERA",      # commented-out code
    "FURB",     # refurb
    "G",        # logging format
    "ICN",      # import conventions
    "ISC",      # implicit string concat
    "LOG",      # logging
    "PERF",     # perflint
    "PGH",      # pygrep hooks
    "PIE",      # misc lints
    "PT",       # pytest style
    "PTH",      # pathlib
    "RET",      # return
    "RSE",      # raise/return
    "S",        # bandit rules
    "SIM",      # simplify
    "SLOT",     # __slots__
    "T20",      # print
    "TRY",      # exception handling
    "RUF",      # ruff-specific
]
ignore = [
    "ISC001",  # single-line implicit concat conflicts with the formatter
    "TRY003",  # long messages in raise calls are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "T201"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/sandboxkit"]

[tool.coverage.report]
show_missing = true
# Payload code executes post-fork and is invisible to coverage.py; 50 is
# the honest floor for this package.
fail_under = 50

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "userns: tests that need unprivileged user namespaces",
    "landlock: tests that need kernel Landlock support",
]
