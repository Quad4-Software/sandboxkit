name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "9 7 * * 1"

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          enable-cache: true

      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run bandit -r src/
      - run: uv run mypy
      - run: uvx ty check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          enable-cache: true

      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}

      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w user.max_user_namespaces=15000

      - name: Delegate a writable cgroup v2 subtree
        run: |
          echo "+cpu +memory +pids" | sudo tee /sys/fs/cgroup/cgroup.subtree_control
          sudo mkdir -p /sys/fs/cgroup/q4ci/workload
          echo "+cpu +memory +pids" | sudo tee /sys/fs/cgroup/q4ci/cgroup.subtree_control
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/q4ci
          sudo chmod a-w /sys/fs/cgroup/q4ci/workload /sys/fs/cgroup/q4ci/workload/*

      - name: Test inside the delegated cgroup
        run: |
          echo $$ | sudo tee /sys/fs/cgroup/q4ci/workload/cgroup.procs
          Q4_REQUIRE_LIVE=1 uv run pytest --cov -rs

      - name: Test cgroup-unavailable paths
        run: uv run pytest tests/test_cgroups.py -k unavailable -rs
